<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 136" role="img" aria-label="1章 git、2章 HTML と CSS、3章 フレームワーク、4章 公開の順に進む">
<style>
  text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; font-size: 15px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .muted { fill: #5f6670; font-size: 13px; }
  .accent { fill: #1d5c8c; }
  .box { fill: #ffffff; stroke: #c9c9c2; stroke-width: 1.5; }
  .soft { fill: #e8f0f6; stroke: #1d5c8c; stroke-width: 1.5; }
  .plain { fill: #f1f1ec; stroke: none; }
  .line { stroke: #8a9099; stroke-width: 1.5; fill: none; }
  .aline { stroke: #1d5c8c; stroke-width: 2; fill: none; }
  .dot { fill: #1d5c8c; }
  .hollow { fill: #ffffff; stroke: #1d5c8c; stroke-width: 2; }
  .head { fill: #8a9099; }
  .ahead { fill: #1d5c8c; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e6e3; }
    .muted { fill: #9aa0a8; }
    .accent { fill: #7db4dc; }
    .box { fill: #1c1f23; stroke: #3a3e44; }
    .soft { fill: #1d2a35; stroke: #7db4dc; }
    .plain { fill: #202328; }
    .line { stroke: #7a808a; }
    .aline { stroke: #7db4dc; }
    .dot { fill: #7db4dc; }
    .hollow { fill: #1c1f23; stroke: #7db4dc; }
    .head { fill: #7a808a; }
    .ahead { fill: #7db4dc; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>
</defs>
<rect x="10" y="20" width="150" height="96" rx="10" class="box"/><text x="85" y="52" text-anchor="middle" class="muted">1章</text><text x="85" y="78" text-anchor="middle" style="font-weight:700">git</text><text x="85" y="100" text-anchor="middle" class="muted">変更を記録する</text><line x1="164" y1="68" x2="184" y2="68" class="line" marker-end="url(#a)"/><rect x="188" y="20" width="150" height="96" rx="10" class="box"/><text x="263" y="52" text-anchor="middle" class="muted">2章</text><text x="263" y="78" text-anchor="middle" style="font-weight:700">HTML / CSS</text><text x="263" y="100" text-anchor="middle" class="muted">ページの中身と見た目</text><line x1="342" y1="68" x2="362" y2="68" class="line" marker-end="url(#a)"/><rect x="366" y="20" width="150" height="96" rx="10" class="box"/><text x="441" y="52" text-anchor="middle" class="muted">3章</text><text x="441" y="78" text-anchor="middle" style="font-weight:700">フレームワーク</text><text x="441" y="100" text-anchor="middle" class="muted">部品とデータに分ける</text><line x1="520" y1="68" x2="540" y2="68" class="line" marker-end="url(#a)"/><rect x="544" y="20" width="150" height="96" rx="10" class="soft"/><text x="619" y="52" text-anchor="middle" class="muted">4章</text><text x="619" y="78" text-anchor="middle" style="font-weight:700">公開</text><text x="619" y="100" text-anchor="middle" class="muted">新しいサイトを出す</text>
</svg>
