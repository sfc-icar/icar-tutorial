<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 186" role="img" aria-label="main から自分の branch を枝分かれさせ、そこで commit し、最後に main へ取り込む">
<style>
  text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; font-size: 15px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .muted { fill: #5f6670; font-size: 13px; }
  .accent { fill: #1d5c8c; }
  .box { fill: #ffffff; stroke: #c9c9c2; stroke-width: 1.5; }
  .soft { fill: #e8f0f6; stroke: #1d5c8c; stroke-width: 1.5; }
  .plain { fill: #f1f1ec; stroke: none; }
  .line { stroke: #8a9099; stroke-width: 1.5; fill: none; }
  .aline { stroke: #1d5c8c; stroke-width: 2; fill: none; }
  .dot { fill: #1d5c8c; }
  .hollow { fill: #ffffff; stroke: #1d5c8c; stroke-width: 2; }
  .head { fill: #8a9099; }
  .ahead { fill: #1d5c8c; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e6e3; }
    .muted { fill: #9aa0a8; }
    .accent { fill: #7db4dc; }
    .box { fill: #1c1f23; stroke: #3a3e44; }
    .soft { fill: #1d2a35; stroke: #7db4dc; }
    .plain { fill: #202328; }
    .line { stroke: #7a808a; }
    .aline { stroke: #7db4dc; }
    .dot { fill: #7db4dc; }
    .hollow { fill: #1c1f23; stroke: #7db4dc; }
    .head { fill: #7a808a; }
    .ahead { fill: #7db4dc; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>
</defs>
<text x="20" y="62" class="muted mono">main</text><line x1="80" y1="56" x2="660" y2="56" class="line"/><circle cx="110" cy="56" r="8" class="dot"/><circle cx="220" cy="56" r="8" class="dot"/><circle cx="600" cy="56" r="8" class="dot"/><path d="M220,56 C260,56 260,130 300,130 L480,130 C540,130 540,56 600,56" class="aline"/><circle cx="330" cy="130" r="8" class="hollow"/><circle cx="420" cy="130" r="8" class="hollow"/><text x="300" y="166" class="accent mono">practice-あなたの名前</text><text x="600" y="30" text-anchor="middle" class="muted">取り込む（merge）</text><text x="220" y="30" text-anchor="middle" class="muted">枝分かれ</text>
</svg>
