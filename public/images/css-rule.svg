<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 146" role="img" aria-label="セレクタ、プロパティ、値からなる CSS のルール">
<style>
  text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; font-size: 15px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .muted { fill: #5f6670; font-size: 13px; }
  .accent { fill: #1d5c8c; }
  .box { fill: #ffffff; stroke: #c9c9c2; stroke-width: 1.5; }
  .soft { fill: #e8f0f6; stroke: #1d5c8c; stroke-width: 1.5; }
  .plain { fill: #f1f1ec; stroke: none; }
  .line { stroke: #8a9099; stroke-width: 1.5; fill: none; }
  .aline { stroke: #1d5c8c; stroke-width: 2; fill: none; }
  .dot { fill: #1d5c8c; }
  .hollow { fill: #ffffff; stroke: #1d5c8c; stroke-width: 2; }
  .head { fill: #8a9099; }
  .ahead { fill: #1d5c8c; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e6e3; }
    .muted { fill: #9aa0a8; }
    .accent { fill: #7db4dc; }
    .box { fill: #1c1f23; stroke: #3a3e44; }
    .soft { fill: #1d2a35; stroke: #7db4dc; }
    .plain { fill: #202328; }
    .line { stroke: #7a808a; }
    .aline { stroke: #7db4dc; }
    .dot { fill: #7db4dc; }
    .hollow { fill: #1c1f23; stroke: #7db4dc; }
    .head { fill: #7a808a; }
    .ahead { fill: #7db4dc; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>
</defs>
<text x="60" y="64" class="mono accent" style="font-size:26px">.member-item h3</text><text x="310" y="64" class="mono " style="font-size:26px">{</text><text x="340" y="64" class="mono " style="font-size:26px">color</text><text x="418" y="64" class="mono " style="font-size:26px">:</text><text x="444" y="64" class="mono " style="font-size:26px">#1d5c8c</text><text x="553" y="64" class="mono " style="font-size:26px">;</text><text x="580" y="64" class="mono " style="font-size:26px">}</text><line x1="60" y1="82" x2="294" y2="82" class="aline"/><text x="177" y="108" text-anchor="middle" class="muted">セレクタ（どこに）</text><line x1="340" y1="82" x2="418" y2="82" class="line"/><text x="379" y="108" text-anchor="middle" class="muted">プロパティ（何を）</text><line x1="444" y1="82" x2="553" y2="82" class="line"/><text x="498" y="132" text-anchor="middle" class="muted">値（どうする）</text>
</svg>
