<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" role="img" aria-label="push すると GitHub Actions がビルドし、GitHub Pages で公開される">
<style>
  text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; font-size: 15px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .muted { fill: #5f6670; font-size: 13px; }
  .accent { fill: #1d5c8c; }
  .box { fill: #ffffff; stroke: #c9c9c2; stroke-width: 1.5; }
  .soft { fill: #e8f0f6; stroke: #1d5c8c; stroke-width: 1.5; }
  .plain { fill: #f1f1ec; stroke: none; }
  .line { stroke: #8a9099; stroke-width: 1.5; fill: none; }
  .aline { stroke: #1d5c8c; stroke-width: 2; fill: none; }
  .dot { fill: #1d5c8c; }
  .hollow { fill: #ffffff; stroke: #1d5c8c; stroke-width: 2; }
  .head { fill: #8a9099; }
  .ahead { fill: #1d5c8c; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e6e3; }
    .muted { fill: #9aa0a8; }
    .accent { fill: #7db4dc; }
    .box { fill: #1c1f23; stroke: #3a3e44; }
    .soft { fill: #1d2a35; stroke: #7db4dc; }
    .plain { fill: #202328; }
    .line { stroke: #7a808a; }
    .aline { stroke: #7db4dc; }
    .dot { fill: #7db4dc; }
    .hollow { fill: #1c1f23; stroke: #7db4dc; }
    .head { fill: #7a808a; }
    .ahead { fill: #7db4dc; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>
</defs>
<rect x="20" y="20" width="200" height="80" rx="10" class="box"/><text x="120" y="54" text-anchor="middle" style="font-weight:700">push</text><text x="120" y="78" text-anchor="middle" class="muted">あなたのPC</text><line x1="224" y1="60" x2="256" y2="60" class="line" marker-end="url(#a)"/><rect x="260" y="20" width="200" height="80" rx="10" class="box"/><text x="360" y="54" text-anchor="middle" style="font-weight:700">ビルド</text><text x="360" y="78" text-anchor="middle" class="muted">GitHub Actions</text><line x1="464" y1="60" x2="496" y2="60" class="line" marker-end="url(#a)"/><rect x="500" y="20" width="200" height="80" rx="10" class="soft"/><text x="600" y="54" text-anchor="middle" style="font-weight:700">公開</text><text x="600" y="78" text-anchor="middle" class="muted">GitHub Pages</text>
</svg>
