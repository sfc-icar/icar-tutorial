<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-label="あなたのPCから GitHub へ push し、同期は GitHub から pull して受け取る">
<style>
  text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; font-size: 15px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .muted { fill: #5f6670; font-size: 13px; }
  .accent { fill: #1d5c8c; }
  .box { fill: #ffffff; stroke: #c9c9c2; stroke-width: 1.5; }
  .soft { fill: #e8f0f6; stroke: #1d5c8c; stroke-width: 1.5; }
  .plain { fill: #f1f1ec; stroke: none; }
  .line { stroke: #8a9099; stroke-width: 1.5; fill: none; }
  .aline { stroke: #1d5c8c; stroke-width: 2; fill: none; }
  .dot { fill: #1d5c8c; }
  .hollow { fill: #ffffff; stroke: #1d5c8c; stroke-width: 2; }
  .head { fill: #8a9099; }
  .ahead { fill: #1d5c8c; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e6e3; }
    .muted { fill: #9aa0a8; }
    .accent { fill: #7db4dc; }
    .box { fill: #1c1f23; stroke: #3a3e44; }
    .soft { fill: #1d2a35; stroke: #7db4dc; }
    .plain { fill: #202328; }
    .line { stroke: #7a808a; }
    .aline { stroke: #7db4dc; }
    .dot { fill: #7db4dc; }
    .hollow { fill: #1c1f23; stroke: #7db4dc; }
    .head { fill: #7a808a; }
    .ahead { fill: #7db4dc; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>
</defs>
<rect x="20" y="30" width="200" height="110" rx="10" class="box"/><text x="120" y="64" text-anchor="middle" style="font-weight:700">あなたのPC</text><text x="120" y="88" text-anchor="middle" class="muted">手元のリポジトリ</text><text x="120" y="110" text-anchor="middle" class="muted">ここで編集・commit</text><rect x="260" y="30" width="200" height="110" rx="10" class="soft"/><text x="360" y="64" text-anchor="middle" style="font-weight:700">GitHub</text><text x="360" y="88" text-anchor="middle" class="muted">みんなの共有場所</text><text x="360" y="110" text-anchor="middle" class="muted">（リモート）</text><rect x="500" y="30" width="200" height="110" rx="10" class="box"/><text x="600" y="64" text-anchor="middle" style="font-weight:700">同期のPC</text><text x="600" y="88" text-anchor="middle" class="muted">手元のリポジトリ</text><path d="M200,150 C220,185 290,185 330,150" class="aline" marker-end="url(#b)"/><text x="245" y="200" text-anchor="middle" class="accent mono">push</text><path d="M390,150 C430,185 500,185 520,150" class="line" marker-end="url(#a)"/><text x="475" y="200" text-anchor="middle" class="muted mono">pull</text>
</svg>
