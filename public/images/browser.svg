<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 206" role="img" aria-label="サーバーが HTML、CSS、画像のファイルを送り、ブラウザがそれを組み立てて画面にする">
<style>
  text { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1f2328; font-size: 15px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .muted { fill: #5f6670; font-size: 13px; }
  .accent { fill: #1d5c8c; }
  .box { fill: #ffffff; stroke: #c9c9c2; stroke-width: 1.5; }
  .soft { fill: #e8f0f6; stroke: #1d5c8c; stroke-width: 1.5; }
  .plain { fill: #f1f1ec; stroke: none; }
  .line { stroke: #8a9099; stroke-width: 1.5; fill: none; }
  .aline { stroke: #1d5c8c; stroke-width: 2; fill: none; }
  .dot { fill: #1d5c8c; }
  .hollow { fill: #ffffff; stroke: #1d5c8c; stroke-width: 2; }
  .head { fill: #8a9099; }
  .ahead { fill: #1d5c8c; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e6e3; }
    .muted { fill: #9aa0a8; }
    .accent { fill: #7db4dc; }
    .box { fill: #1c1f23; stroke: #3a3e44; }
    .soft { fill: #1d2a35; stroke: #7db4dc; }
    .plain { fill: #202328; }
    .line { stroke: #7a808a; }
    .aline { stroke: #7db4dc; }
    .dot { fill: #7db4dc; }
    .hollow { fill: #1c1f23; stroke: #7db4dc; }
    .head { fill: #7a808a; }
    .ahead { fill: #7db4dc; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker>
</defs>
<rect x="20" y="20" width="190" height="170" rx="10" class="box"/><text x="115" y="50" text-anchor="middle" style="font-weight:700">サーバー</text><text x="115" y="72" text-anchor="middle" class="muted">（GitHub Pages）</text><rect x="45" y="90" width="140" height="26" rx="4" class="plain"/><text x="115" y="108" text-anchor="middle" class="mono" style="font-size:13px">index.html</text><rect x="45" y="122" width="140" height="26" rx="4" class="plain"/><text x="115" y="140" text-anchor="middle" class="mono" style="font-size:13px">style.css</text><rect x="45" y="154" width="140" height="26" rx="4" class="plain"/><text x="115" y="172" text-anchor="middle" class="mono" style="font-size:13px">photo.jpg</text><line x1="220" y1="105" x2="330" y2="105" class="aline" marker-end="url(#b)"/><text x="275" y="94" text-anchor="middle" class="muted">ファイルを送る</text><rect x="340" y="20" width="360" height="170" rx="10" class="box"/><rect x="340" y="20" width="360" height="30" rx="10" class="plain"/><text x="360" y="40" class="muted mono" style="font-size:12px">icar.sfc.wide.ad.jp</text><text x="360" y="80" style="font-weight:700;font-size:18px">ICAR</text><rect x="360" y="96" width="60" height="60" rx="6" class="soft"/><text x="434" y="118">村井純</text><text x="434" y="140" class="muted">教授</text><text x="520" y="176" class="muted">ブラウザが組み立てた画面</text>
